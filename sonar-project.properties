# Must match the project on SonarQube Cloud exactly. Importing the GitHub repo
# there generates the key as <org>_<repo>, not the bare repo name — copy it from
# the project's Project Information page rather than assuming this value.
sonar.projectKey=kureka77_afterhours-fm
sonar.projectName=Afterhours FM

# SonarQube Cloud organisation *key*, not its display name ("Adrian Kurek" is
# the name; the key is the GitHub login the organisation was imported from).
# A fork analysing into its own organisation changes both this and projectKey.
# The workflow skips analysis entirely when SONAR_TOKEN is unset, so a fork
# without a token never breaks CI on this.
sonar.organization=kureka77

# sunshine_playlist.py was missing here — it was added with the Sunshine Live
# playlist source and never registered, so Sonar had been silently skipping it.
sonar.sources=main.py,database.py,models.py,spotify.py,shazam_fallback.py,sunshine_playlist.py,config.py,static,stations.json
sonar.tests=tests
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8
sonar.exclusions=venv/**,node_modules/**,docs/**,**/__pycache__/**,coverage/**,htmlcov/**

# Coverage, produced by .github/workflows/sonar.yml: Cobertura XML from
# pytest-cov, LCOV from Vitest. Without these Sonar reports 0% coverage and its
# quality gate fails on "coverage on new code" for reasons unrelated to the code.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# static/utils.js deliberately mirrors the pure helpers inlined in index.html so
# Vitest can exercise them in isolation (see CLAUDE.md). Duplication is the
# point, so exclude it from copy-paste detection rather than field the warning
# forever.
sonar.cpd.exclusions=static/utils.js

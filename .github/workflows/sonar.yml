name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Read into a side variable rather than straight into SONAR_HOST_URL. An
      # unset repository variable expands to "", and the scanner treats a
      # *present but empty* SONAR_HOST_URL as a server whose address is "" —
      # it only defaults to SonarQube Cloud when the variable is absent
      # altogether (sonar-scanner-java-library: EnvironmentConfig.load copies
      # any non-null env value, and ScannerEndpointResolver branches on
      # containsKey, not on blankness). The guard step below exports the real
      # variable only when there is a value.
      SONAR_HOST_URL_VAR: ${{ vars.SONAR_HOST_URL }}

    steps:
      # Sonar is the only check here needing credentials, and a pull request
      # from a fork never receives them. Failing every such PR red would train
      # people to ignore a red X, so detect the missing token and skip instead —
      # the rest of CI still gates the merge.
      #
      # One-time setup to switch this on:
      #   1. Create the project on SonarQube Cloud (or your own server). On
      #      Cloud, turn off Automatic Analysis for it — Cloud refuses a
      #      CI-based scan while that is on.
      #   2. Add repository secret SONAR_TOKEN.
      #   3. In sonar-project.properties, uncomment sonar.organization and make
      #      sonar.projectKey match the key Cloud generated (<org>_<repo>).
      #   4. Self-hosted only: add repository variable SONAR_HOST_URL. Leave it
      #      unset for Cloud.
      - name: Is SonarQube configured?
        id: guard
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::notice::SONAR_TOKEN is not set — skipping SonarQube analysis."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          # Self-hosted server only; absent means the scanner targets Cloud.
          if [ -n "${SONAR_HOST_URL_VAR}" ]; then
            echo "SONAR_HOST_URL=${SONAR_HOST_URL_VAR}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
        with:
          # Sonar reads git history to attribute issues to authors and to decide
          # what counts as "new code". Under the default shallow clone every
          # line looks new, which makes the new-code quality gate meaningless.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install Python dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Modules listed explicitly rather than --cov=. so the report covers the
      # same files as sonar.sources, without dragging in tests or the venv.
      - name: pytest with coverage (Cobertura XML)
        if: steps.guard.outputs.run == 'true'
        run: |
          pytest --cov=main --cov=database --cov=models --cov=spotify \
                 --cov=shazam_fallback --cov=sunshine_playlist --cov=config \
                 --cov-report=xml

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20

      - name: Install Node dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install

      - name: Vitest with coverage (LCOV)
        if: steps.guard.outputs.run == 'true'
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text

      # qualitygate.wait makes this an actual gate rather than a fire-and-forget
      # upload: the step blocks on the server's verdict and fails the job if the
      # quality gate fails. Without it a red gate would still show a green CI.
      - name: SonarQube scan
        if: steps.guard.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: -Dsonar.qualitygate.wait=true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    name: Backend tests (pytest · SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  # Same suite, real PostgreSQL. Prod runs Postgres while dev and the default
  # test run use SQLite, and the two engines disagree in ways that matter:
  # asyncpg rejects a tz-aware datetime for the naive TIMESTAMP column that
  # started_at is, while SQLite silently accepts it. That gap once shipped a
  # bug to production — every local check passed, and it only surfaced on a
  # real deploy. This job is what closes it.
  test-backend-postgres:
    name: Backend tests (pytest · PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Without this the job races the container: the runner would start
        # pytest while Postgres is still initialising and every test would
        # fail on connection refused.
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
        run: pytest

  test-frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Vitest
        run: npm test

  security:
    name: Security scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit

  security-python:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit pip-audit

      # Bandit is a Python SAST pass — hardcoded credentials, shell injection,
      # unsafe deserialisation, weak crypto. Tests are excluded: assert-based
      # patterns there trip rules that only matter in production code.
      - name: Bandit (static analysis)
        run: bandit -r . -x ./tests,./venv,./node_modules -ll

      # Dependency CVEs. vibra is installed from a pinned git commit rather than
      # PyPI, so pip-audit cannot look it up and skips it — that is expected, and
      # --strict would fail the build on that skip alone rather than on a real
      # vulnerability.
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

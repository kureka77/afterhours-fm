name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    name: Backend tests (pytest · SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  # Same suite, real PostgreSQL. Prod runs Postgres while dev and the default
  # test run use SQLite, and the two engines disagree in ways that matter:
  # asyncpg rejects a tz-aware datetime for the naive TIMESTAMP column that
  # started_at is, while SQLite silently accepts it. That gap once shipped a
  # bug to production — every local check passed, and it only surfaced on a
  # real deploy. This job is what closes it.
  test-backend-postgres:
    name: Backend tests (pytest · PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Without this the job races the container: the runner would start
        # pytest while Postgres is still initialising and every test would
        # fail on connection refused.
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
        run: pytest

  test-frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Vitest
        run: npm test

  security:
    name: Security scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit

  security-python:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install scanners
        run: pip install bandit pip-audit

      # Bandit is a Python SAST pass — hardcoded credentials, shell injection,
      # unsafe deserialisation, weak crypto. Tests are excluded: assert-based
      # patterns there trip rules that only matter in production code.
      - name: Bandit (static analysis)
        run: bandit -r . -x ./tests,./venv,./node_modules -ll

      # Dependency CVEs. vibra is installed from a pinned git commit rather than
      # PyPI, so pip-audit cannot look it up and skips it — that is expected, and
      # --strict would fail the build on that skip alone rather than on a real
      # vulnerability.
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  # Secret scanning. The other scanners look for vulnerable code and vulnerable
  # dependencies; neither notices a credential committed by mistake. This repo
  # handles a Spotify refresh token, a Postgres password and (via .env) real
  # secrets, so the failure mode is live rather than theoretical.
  secrets-scan:
    name: Security scan (gitleaks — secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A secret is only really gone once it is out of *history*. Scanning
          # the tip alone would pass a repo whose previous commit leaked a key.
          fetch-depth: 0

      # Installed from the pinned release rather than via the marketplace action,
      # which asks organisation users for a licence key — this keeps the job
      # working regardless of who forks it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a finding never echoes the secret itself into public build
      # logs, which would leak it a second time.
      - name: Scan commit history for secrets
        run: gitleaks detect --no-banner --redact --verbose

  # Container scanning. bandit covers our Python, pip-audit and npm audit cover
  # our dependencies — none of them see the base image. Most of the bytes we
  # actually ship come from python:3.14-slim, and its CVEs are invisible to
  # every other job here.
  container-scan:
    name: Security scan (Trivy — container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the prod image
        run: docker build --target prod -t afterhours-fm:ci .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: afterhours-fm:ci
          format: table
          severity: HIGH,CRITICAL
          # OS packages only. Each scanner here owns exactly one layer:
          # pip-audit covers Python dependencies, npm audit covers JavaScript,
          # and the base image's Debian packages are what nothing else sees.
          # Letting Trivy also scan Python packages produced pure noise — it
          # reported a setuptools version the image does not actually ship
          # (verified by exporting the filesystem: only 84.0.0 is present), and
          # flagged the msgpack that pip vendors internally, which no pip
          # release has yet bumped and which the app never imports.
          # Input is `vuln-type`, not `pkg-types` — the action still uses the
          # old name.
          vuln-type: os
          # Unfixed CVEs are the overwhelming majority here: this image carries
          # 274 HIGH and 18 CRITICAL OS findings for which Debian has published
          # no fix, and every one disappears under this flag. Failing on them
          # would make the job permanently red and therefore ignored; failing
          # only on fixable ones keeps a red X meaningful.
          ignore-unfixed: true
          exit-code: "1"

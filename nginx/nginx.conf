server {
    listen 80;

    # compress text assets in transit
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # images: 30-day cache — browsers skip the round-trip entirely
    location ~* ^/static/.*\.(jpg|jpeg|webp|png|gif|ico|svg|woff2)$ {
        root    /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # css/js: 1-day cache with revalidation (no immutable — files can change)
    location /static/ {
        root    /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public";
    }

    # all API calls proxied to the FastAPI backend
    location /api/ {
        proxy_pass         http://prod:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # root returns the SPA shell
    location / {
        root      /usr/share/nginx/html/static;
        try_files $uri /index.html;
    }
}
